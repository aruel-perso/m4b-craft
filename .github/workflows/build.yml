name: Test, package and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
  CARGO_PROFILE_RELEASE_DEBUG: 0
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ runner.temp }}/m4b-release
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu-release
          cache-targets: true
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: vendor/windows-media
          key: windows-media-ffmpeg-8.0.1-zlib-1.3.1-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}
      - name: Build prerequisites (disposable CI runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 wixl msitools ffmpeg libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - name: Fetch pinned upstream media source and build static GNU tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/windows-media
          curl --fail --location --proto '=https' --tlsv1.2 -o "$TMPDIR/ffmpeg-8.0.1.tar.xz" https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz
          curl --fail --location --proto '=https' --tlsv1.2 -o "$TMPDIR/zlib-1.3.1.tar.gz" https://zlib.net/fossils/zlib-1.3.1.tar.gz
          echo "05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41  $TMPDIR/ffmpeg-8.0.1.tar.xz" | sha256sum -c -
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  $TMPDIR/zlib-1.3.1.tar.gz" | sha256sum -c -
          bash scripts/build-ffmpeg-windows.sh "$TMPDIR/ffmpeg-8.0.1.tar.xz" "$TMPDIR/zlib-1.3.1.tar.gz"
      - name: Build app, CLI and MSI
        run: python3 scripts/package-release.py
      - name: Verify MSI tables, contents and signing tooling
        run: |
          python3 scripts/test-release.py --msi dist/release-0.2.0-alpha.1/m4b-Craft-0.2.0-alpha.1-windows-x86_64.msi --scratch "$TMPDIR"
          msiinfo export dist/release-0.2.0-alpha.1/*.msi Property
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/release-*/*.msi
            dist/release-*/*.zip
            dist/release-*/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'aruel-perso/m4b-craft'
    needs: build
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ runner.temp }}/m4b-release
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Require matching version and external signing secret
        env:
          UPDATE_SIGNING_PEM: ${{ secrets.UPDATE_SIGNING_PEM }}
        run: |
          test "$GITHUB_REF_NAME" = v0.2.0-alpha.1
          test -n "$UPDATE_SIGNING_PEM"
          mkdir -p "$TMPDIR"
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_PEM" > "$TMPDIR/update-signing.pem"
          python3 scripts/sign-update.py --key "$TMPDIR/update-signing.pem" --version "${GITHUB_REF_NAME#v}" --msi "release-assets/m4b-Craft-${GITHUB_REF_NAME#v}-windows-x86_64.msi" --out release-assets/update-windows-x86_64.json --scratch "$TMPDIR"
      - name: Publish signed release only after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "m4b-Craft ${GITHUB_REF_NAME#v}" --notes-file RELEASE.md
      - if: always()
        run: rm -f "$TMPDIR/update-signing.pem"
