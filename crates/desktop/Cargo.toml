[package]
name = "m4b-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
m4b-core = { path = "../core" }
anyhow.workspace = true
eframe = "0.29"
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
